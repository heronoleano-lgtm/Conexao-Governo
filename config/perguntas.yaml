# Catálogo de perguntas de negócio de um gestor de custódia de transferências federais.
# Cada pergunta aponta para a tela que responde e as regras usadas. Situação:
#   respondida = o painel responde com os dados abertos;
#   parcial    = responde em parte (aproximação ou histórico ainda acumulando);
#   fonte externa = precisa de dado que não está no Transferegov (ver obs).
# Para incorporar uma pergunta nova: acrescente aqui, crie a regra em regras.yaml e o motor/tela.

